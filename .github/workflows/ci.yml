name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch - no value in testing an old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check content_forge tests

      - name: Check formatting
        run: ruff format --check content_forge tests

  test:
    name: Tests and deterministic evaluation (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/ -v --tb=short

      # The golden-dataset regression gate. Runs without model credentials, so
      # it gates every PR rather than only post-merge builds.
      - name: Deterministic evaluation suite
        run: contentforge-eval

      - name: Verify the agent tree builds
        run: |
          python -c "
          from content_forge.agent import app
          assert app.root_agent.name == 'editorial_coordinator'
          assert len(app.plugins) == 3
          print('agent tree OK:', app.name)
          "

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: contentforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm contentforge:ci \
            python -c "from content_forge.agent import app; assert app.root_agent; print('container OK')"

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Format check
        run: terraform fmt -check -recursive deployment/terraform

      - name: Validate
        working-directory: deployment/terraform
        run: |
          terraform init -backend=false
          terraform validate

  agent-evaluation:
    name: Golden-dataset agent evaluation
    runs-on: ubuntu-latest
    needs: [test]
    # Needs model credentials, so it runs post-merge and on demand rather than
    # on every PR from a fork.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write # Workload Identity Federation - no long-lived JSON key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Authenticate to Google Cloud
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Run golden-dataset evaluation
        if: steps.auth.outcome == 'success'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: us-central1
          GOOGLE_GENAI_USE_VERTEXAI: "1"
        run: contentforge-eval --with-agent

      - name: Report skip
        if: steps.auth.outcome != 'success'
        run: |
          echo "::notice::Skipped live agent evaluation - GCP Workload Identity is not configured on this repository. Configure the GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT and GCP_PROJECT_ID repository variables to enable it."
