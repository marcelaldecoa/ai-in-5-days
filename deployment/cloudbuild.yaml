###############################################################################
# ContentForge - Cloud Build pipeline
#
#   gcloud builds submit --config deployment/cloudbuild.yaml \
#     --substitutions=_ENVIRONMENT=dev
#
# The gates run before the build, not after: an image that fails evaluation
# should never reach the registry in the first place.
###############################################################################

substitutions:
  _ENVIRONMENT: dev
  _REGION: us-central1
  _REPOSITORY: contentforge
  _SERVICE_NAME: contentforge-dev

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # --- Gate 1: lint -------------------------------------------------------
  - id: lint
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet ruff
        ruff check content_forge tests
        ruff format --check content_forge tests

  # --- Gate 2: unit tests + deterministic evaluation ----------------------
  # No model credentials needed, so this runs on every build.
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet -e ".[dev]"
        pytest tests/ -v --tb=short
        contentforge-eval

  # --- Build --------------------------------------------------------------
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/agent:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/agent:latest
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/agent:latest
      - .
    waitFor: [lint, test]

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/agent
    waitFor: [build]

  # --- Gate 3: vulnerability scan ----------------------------------------
  # Blocks deployment on a CRITICAL CVE in the built image.
  - id: scan
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/agent:$SHORT_SHA"
        gcloud artifacts docker images scan "$IMAGE" \
          --format='value(response.scan)' > /workspace/scan_id.txt || exit 0
        CRITICAL=$(gcloud artifacts docker images list-vulnerabilities \
          "$(cat /workspace/scan_id.txt)" \
          --format='value(vulnerability.effectiveSeverity)' 2>/dev/null \
          | grep -c CRITICAL || true)
        if [ "$CRITICAL" -gt 0 ]; then
          echo "Blocking deploy: $CRITICAL CRITICAL vulnerabilities in image."
          exit 1
        fi
    waitFor: [push]

  # --- Deploy -------------------------------------------------------------
  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/agent:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --set-env-vars=CONTENTFORGE_ENVIRONMENT=${_ENVIRONMENT}
    waitFor: [scan]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/agent:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/agent:latest

timeout: 1800s
